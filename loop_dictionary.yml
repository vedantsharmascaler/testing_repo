- name: Create users with specific groups
  hosts: dbservers
  become: yes
  tasks:
    - name: Create required groups
      group:
        name: "{{ item }}"
        state: present
      loop:
        - developers
        - testers

    - name: Add multiple users with groups
      user:
        name: "{{ item.name }}"
        groups: "{{ item.groups }}"
        append: yes  # Ensures user is added to the group instead of replacing existing ones
        state: present
      loop:
        - { name: alice, groups: sudo }
        - { name: bob, groups: developers }
        - { name: charlie, groups: testers }
